# Fly.io config — rename app to whatever `flyctl launch` gives you.
app = "bitget-relay"
primary_region = "fra"  # Frankfurt — close to Bitget's EU edge

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep machine warm so IP stays stable
  auto_start_machines = true
  min_machines_running = 1

[[services.tcp_checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "5s"
  port = 8080
